<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #101014; color: white;
            font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: relative; overflow: hidden;
        }
        .background-img {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw; max-height: 90vh;
            opacity: 0.35; z-index: 0; pointer-events: none;
        }
        .container {
            text-align: center; position: relative; z-index: 1;
        }
        h1 { font-size: 42px; }
        p { color: #999; }

        /* ── Custom cursors ─────────────────────────────── */
        /* Global default → confused icon */
        html {
            cursor: url("assets/confused.webp") 16 16, auto;
        }

        /* WIP / not-yet-released elements → select icon */
        .wip-item, [data-cursor="wip"] {
            cursor: url("assets/select.webp") 16 16, crosshair !important;
        }

        /* ── WIP badge ──────────────────────────────────── */
        .wip-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #880000;
            user-select: none;
        }
        .wip-badge img {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <img class="background-img" src="assets/image.png" alt="">
    <div class="container">
        <h1>Hello World.</h1>
        <p>My first website is online.</p>

        <!-- Grid Button -->
        <button id="grid-btn">
            <canvas></canvas>
            <span class="btn-text">Hover Me</span>
        </button>

        <!-- Example: WIP tag — uncomment when you have one to show -->
        <!--
        <div class="wip-item wip-badge">
            <img src="assets/select.webp" alt="">
            <span>Coming soon</span>
        </div>
        -->

        <!-- Example: regular link with cursor.webp hover -->
        <!--
        <a href="#">View more</a>
        -->
    </div>

    <script src="grid-button.js"></script>
</body>
</html>
