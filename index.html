<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #101014; color: white;
            font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: relative; overflow: hidden;
        }
        .background-img {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw; max-height: 90vh;
            opacity: 0.35; z-index: 0; pointer-events: none;
        }
        .container {
            text-align: center; position: relative; z-index: 1;
        }
        h1 { font-size: 42px; }
        p { color: #999; }

        /* ── Grid Button ─────────────────────────────── */
        #grid-btn {
            position: relative; width: 220px; height: 64px;
            margin-top: 32px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            color: #bbb; font-size: 15px; font-family: inherit;
            cursor: pointer; overflow: hidden;
            transition: border-color 0.3s ease;
        }
        #grid-btn:hover { border-color: rgba(208,0,0,0.5); }
        #grid-btn canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: none;
        }
        #grid-btn:hover canvas { display: block; }
        #grid-btn .btn-text {
            position: relative; z-index: 2;
            pointer-events: none; line-height: 64px;
        }
    </style>
</head>
<body>
    <img class="background-img" src="mygoon.png" alt="my goon">
    <div class="container">
        <h1>Hello World.</h1>
        <p>My first website is online.</p>
        <button id="grid-btn">
            <canvas></canvas>
            <span class="btn-text">Hover Me</span>
        </button>
    </div>

    <script src="grid-button.js"></script>
</body>
</html>
